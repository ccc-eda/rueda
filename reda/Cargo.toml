[package]
name = "rueda"
description = "reda: one command for rueda's HDL tools (Veryl, Fluxa), synthesis, FPGA / ASIC flows and RISC-V tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["eda", "hdl", "veryl", "fpga", "asic"]
categories = ["command-line-utilities", "development-tools", "simulation"]

[[bin]]
name = "reda"
path = "src/main.rs"

[dependencies]
eda.workspace = true
rvtools.workspace = true
riscv_emu.workspace = true
veryl-sim.workspace = true
veryl-synth.workspace = true
veryl-emu.workspace = true
fluxa.workspace = true
fluxa-synth.workspace = true
