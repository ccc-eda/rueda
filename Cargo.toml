[workspace]
resolver = "2"
members = [
    "reda",
    "eda",
    "eda/bits",
    "riscv/rvemu",
    "riscv/rvtools",
    "veryl/sim",
    "veryl/synth",
    "veryl/emu",
    "fluxa/sim",
    "fluxa/synth",
    "web/wasm",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ccc-eda/rueda"
homepage = "https://ccc-eda.github.io/rueda/web/dist/index.html"

[workspace.dependencies]
veryl-parser = "0.22"
# the workspace's own crates: the path for building here, the version for crates.io
# (keep it equal to workspace.package.version)
bits = { package = "rueda-bits", path = "eda/bits", version = "0.6.0" }
eda = { package = "rueda-eda", path = "eda", version = "0.6.0" }
rvtools = { package = "rueda-rvtools", path = "riscv/rvtools", version = "0.6.0" }
riscv_emu = { package = "rueda-rvemu", path = "riscv/rvemu", version = "0.6.0" }
veryl-sim = { package = "rueda-veryl-sim", path = "veryl/sim", version = "0.6.0" }
veryl-synth = { package = "rueda-veryl-synth", path = "veryl/synth", version = "0.6.0" }
veryl-emu = { package = "rueda-veryl-emu", path = "veryl/emu", version = "0.6.0" }
fluxa = { package = "rueda-fluxa", path = "fluxa/sim", version = "0.6.0" }
fluxa-synth = { package = "rueda-fluxa-synth", path = "fluxa/synth", version = "0.6.0" }

[profile.release]
opt-level = 3

# the web build (web/wasm, riscv/rvemu as wasm32): `cargo build --profile web`
[profile.web]
inherits = "release"
debug = false
lto = true
codegen-units = 1
panic = "abort"
