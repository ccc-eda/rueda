[package]
name = "rueda-veryl-eda"
description = "Veryl HDL to chip: synthesis, FPGA place & route and bitstream, ASIC standard-cell flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "veryl_eda"

[[bin]]
name = "veryl-eda"
path = "src/main.rs"

[[bin]]
name = "v2c"
path = "src/bin/v2c.rs"

[dependencies]
veryl-parser.workspace = true
veryl-sim = { package = "rueda-veryl-sim", path = "../sim" }
