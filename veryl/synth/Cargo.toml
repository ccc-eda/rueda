[package]
name = "rueda-veryl-synth"
description = "Veryl synthesis front end: Veryl HDL to eda's gate netlist, post-synthesis simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "veryl_synth"

[dependencies]
veryl-parser.workspace = true
veryl-sim = { package = "rueda-veryl-sim", path = "../sim" }
eda = { package = "rueda-eda", path = "../../eda" }
rvtools = { package = "rueda-rvtools", path = "../../riscv/rvtools" }
